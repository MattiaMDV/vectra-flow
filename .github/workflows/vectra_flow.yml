name: Vectra Flow (Beta) - Generate Report

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 8 * * *"  # daily 08:15 UTC

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        run: |
          mkdir -p docs
          cp reports/latest.md docs/latest.md
      - name: Commit reports (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(reports): update Vectra Flow beta report"
            git push
          fi
