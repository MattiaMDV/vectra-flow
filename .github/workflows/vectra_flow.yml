name: Vectra Flow (Beta) - Generate Report

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 8 * * *"  # daily 08:15 UTC

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Feedback pipeline (sentiment analysis) ─────────────────────────────
      - name: Fetch feedback data from Google Sheets
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          COLUMN_MAP: ${{ secrets.COLUMN_MAP }}
        run: python -m vectra_flow.fetch_inputs

      - name: Generate feedback report
        env:
          COLUMN_MAP: ${{ secrets.COLUMN_MAP }}
        run: |
          if [ -n "$COLUMN_MAP" ]; then
            python -m vectra_flow.cli --input-glob "data/*.csv" --out-dir reports --column-map "$COLUMN_MAP"
          else
            python -m vectra_flow.cli --input-glob "data/*.csv" --out-dir reports
          fi

      # ── Asset submissions pipeline ─────────────────────────────────────────
      - name: Fetch asset submissions from Google Sheets
        env:
          SHEET_URL: ${{ secrets.ASSET_SHEET_URL }}
          COLUMN_MAP: ${{ secrets.ASSET_COLUMN_MAP }}
          SHEET_DEST: data/assets/sheet.csv
        run: |
          if [ -n "$SHEET_URL" ]; then
            python -m vectra_flow.fetch_inputs
          else
            echo "ASSET_SHEET_URL not set — skipping asset sheet fetch."
          fi

      - name: Generate asset evaluation report
        env:
          ASSET_COLUMN_MAP: ${{ secrets.ASSET_COLUMN_MAP }}
        run: |
          if [ -n "$ASSET_COLUMN_MAP" ]; then
            python -m vectra_flow.cli --mode assets --input-glob "data/assets/*.csv" \
              --out-dir reports --column-map "$ASSET_COLUMN_MAP"
          else
            python -m vectra_flow.cli --mode assets --input-glob "data/assets/*.csv" \
              --out-dir reports
          fi

      # ── Scout pipeline (forum scanning + partnership proposals) ────────────
      - name: Run asset scout and generate partnership proposals
        run: |
          python -m vectra_flow.cli --mode scout --out-dir reports \
            --notify-dir reports/notifications

      # ── Publish to GitHub Pages ────────────────────────────────────────────
      - name: Copy reports to Pages folder
        run: |
          mkdir -p docs/notifications
          cp reports/latest.html docs/index.html
          cp reports/latest.md docs/latest.md
          cp reports/asset_latest.html docs/assets.html
          cp reports/asset_latest.md docs/asset_latest.md
          if [ -f reports/notifications/notifications.html ]; then
            cp reports/notifications/notifications.html docs/notifications/index.html
          fi
          if [ -f reports/notifications/notifications.md ]; then
            cp reports/notifications/notifications.md docs/notifications/notifications.md
          fi
          touch docs/.nojekyll

      - name: Commit reports (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(reports): update Vectra Flow beta report"
            git push
          fi
