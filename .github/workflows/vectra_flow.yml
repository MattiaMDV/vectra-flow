name: Vectra Flow (Beta) - Generate Report

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 8 * * *"  # daily 08:15 UTC

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Google Sheets data
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          COLUMN_MAP: ${{ secrets.COLUMN_MAP }}
        run: python -m vectra_flow.fetch_inputs

      - name: Generate report
        env:
          COLUMN_MAP: ${{ secrets.COLUMN_MAP }}
        run: |
          if [ -n "$COLUMN_MAP" ]; then
            python -m vectra_flow.cli --input-glob "data/*.csv" --out-dir reports --column-map "$COLUMN_MAP"
          else
            python -m vectra_flow.cli --input-glob "data/*.csv" --out-dir reports
          fi

      - name: Copy latest report to Pages folder
        run: |
          mkdir -p docs
          cp reports/latest.html docs/index.html
          cp reports/latest.md docs/latest.md
          touch docs/.nojekyll

      - name: Commit reports (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(reports): update Vectra Flow beta report"
            git push
          fi
